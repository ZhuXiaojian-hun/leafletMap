<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>测试全屏按钮</title>
    <link rel="stylesheet" href="./lib/leaflet/leaflet.css">
    <link rel="stylesheet" href="./lib/expand/leaflet.fullscreen.css">
    <script src="./lib/leaflet/leaflet.js"></script>
    <script src="./lib/expand/leaflet.fullscreen.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial; }
        #map { height: 400px; margin-bottom: 20px; }
        .test-result { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin: 10px 0;
            background: #f5f5f5;
        }
        .test-result h3 { margin-top: 0; }
        .test-result code { 
            background: #fff; 
            padding: 2px 6px; 
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>全屏按钮调试</h1>
    
    <div id="map"></div>
    
    <div class="test-result">
        <h3>测试步骤：</h3>
        <ol>
            <li>打开浏览器开发者工具（F12）</li>
            <li>点击左上角的全屏按钮</li>
            <li>在 Elements 标签中查看按钮的 HTML 结构</li>
            <li>查看 Computed 样式中的 background-image</li>
        </ol>
    </div>
    
    <div class="test-result">
        <h3>检查项：</h3>
        <ul>
            <li>按钮元素类名：<code id="button-class">-</code></li>
            <li>图标元素类名：<code id="icon-class">-</code></li>
            <li>是否有 background-image：<code id="has-bg-image">-</code></li>
            <li>background-image 值：<code id="bg-image-value">-</code></li>
        </ul>
    </div>
    
    <div class="test-result">
        <h3>调试按钮：</h3>
        <button onclick="checkButton()">检查按钮结构</button>
        <button onclick="fixButton()">强制修复图标</button>
        <button onclick="clearLog()">清空日志</button>
    </div>
    
    <div class="test-result">
        <h3>调试日志：</h3>
        <pre id="debug-log" style="height: 300px; overflow-y: auto; background: #000; color: #0f0; padding: 10px;"></pre>
    </div>
    
    <script>
        function log(msg) {
            const logEl = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }
        
        function checkButton() {
            const button = document.querySelector('.leaflet-control-fullscreen a');
            const icon = document.querySelector('.leaflet-control-fullscreen .fullscreen-icon');
            
            if (button) {
                document.getElementById('button-class').textContent = button.className;
                log('按钮类名：' + button.className);
                log('按钮样式：' + button.getAttribute('style'));
                
                const computedStyle = window.getComputedStyle(button);
                log('按钮 computed background-image: ' + computedStyle.backgroundImage);
            } else {
                log('未找到按钮元素');
            }
            
            if (icon) {
                document.getElementById('icon-class').textContent = icon.className;
                log('图标类名：' + icon.className);
                
                const computedStyle = window.getComputedStyle(icon);
                const bgImage = computedStyle.backgroundImage;
                document.getElementById('has-bg-image').textContent = bgImage && bgImage !== 'none' ? '是' : '否';
                document.getElementById('bg-image-value').textContent = bgImage ? bgImage.substring(0, 100) + '...' : '无';
                log('图标 computed background-image: ' + bgImage);
            } else {
                log('未找到图标元素');
                document.getElementById('icon-class').textContent = '不存在';
            }
        }
        
        function fixButton() {
            const icon = document.querySelector('.leaflet-control-fullscreen .fullscreen-icon');
            if (icon) {
                const svg = encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="#000" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>');
                icon.style.backgroundImage = `url("data:image/svg+xml,${svg}")`;
                icon.style.backgroundSize = '24px 24px';
                icon.style.backgroundRepeat = 'no-repeat';
                icon.style.backgroundPosition = 'center';
                icon.style.width = '24px';
                icon.style.height = '24px';
                icon.style.display = 'inline-block';
                log('✅ 已强制设置图标样式');
            } else {
                log('❌ 未找到图标元素');
            }
        }
        
        function clearLog() {
            document.getElementById('debug-log').innerHTML = '';
            log('日志已清空');
        }
        
        // 初始化地图
        const map = L.map('map', {
            center: [28, 113],
            zoom: 7
        });
        
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
            subdomains: ["1", "2", "3", "4"],
            maxZoom: 18
        }).addTo(map);
        
        // 添加全屏控件
        L.control.fullscreen({
            position: 'topleft',
            title: '全屏',
            titleCancel: '退出全屏'
        }).addTo(map);
        
        log('地图已初始化');
        log('请点击"检查按钮结构"按钮查看 HTML 结构');
        
        // 延迟检查
        setTimeout(() => {
            log('页面加载完成，开始检查...');
            checkButton();
        }, 1000);
    </script>
</body>
</html>
